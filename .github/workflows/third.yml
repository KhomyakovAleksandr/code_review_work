name: Assignment 3 - Matrix Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 12 * * 3"
    - cron: "0 22 * * 5"

jobs:
  build:
    strategy:
      fail-fast: false # Важно: если одна задача упадет, остальные продолжат работу
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Используем версии, которые совместимы с твоим Gradle 7.1
        java: [8, 11, 16]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and Test
        run: ./gradlew build test