name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 12 * * 3'
    - cron: '0 22 * * 5'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false # Чтобы падение одной версии не отменяло остальные
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [11, 13, 17]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          # Меняем temurin на zulu, так как у zulu есть поддержка Java 13
          distribution: 'zulu'

      - name: Setup Gradle
        # Этот экшен сам подстроит окружение под версию Java
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradle Wrapper
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        # Если Java 17 всё равно будет падать из-за Gradle 7.1,
        # то хотя бы 11 и 13 должны пройти
        run: ./gradlew build