on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 12 * * 3' # каждую среда в 12:30
    - cron: '0 22 * * 5'  # каждая пятница в 22:00
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [11, 13, 17]
    runs-on: ${{ matrix.os }}
