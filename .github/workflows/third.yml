name: Final Assignment CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 12 * * 3"
    - cron: "0 22 * * 5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [11, 13, 17]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          # Используем zulu, чтобы Java 13 точно нашлась
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with Gradle
        # Трюк: заставляем Gradle запускаться на 11-й Java (которую он понимает),
        # но использовать для компиляции версию из матрицы
        run: ./gradlew build -Dorg.gradle.java.home=$JAVA_HOME_11_X64
        env:
          # Это стандартная переменная в GitHub Actions для Java 11
          JAVA_HOME: ${{ env.JAVA_HOME }}.gradle.java.home=${{ env.JAVA_HOME }}