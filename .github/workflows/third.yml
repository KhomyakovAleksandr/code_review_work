name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 12 * * 3'
    - cron: '0 22 * * 5'

jobs:
  build:
    strategy:
      fail-fast: false # Чтобы лаги GitHub на одной ОС не убивали остальные
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [11, 13, 17]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем нужную Java из матрицы
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu' # Zulu стабильнее для старых версий (13)

      # Устанавливаем Gradle через официальный экшен БЕЗ кэширования (чтобы не было ошибки 400)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true # ОТКЛЮЧАЕМ кэш, так как он у GitHub сейчас сбоит

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with Gradle
        # Прямо указываем Gradle использовать Java 11 для запуска самого себя,
        # но собирать проект версией из матрицы. Это уберет ошибку "Unsupported version"
        run: ./gradlew build -Dorg.gradle.java.home=${{ env.JAVA_HOME }}