name: Java CI with Maven

on:
  push:
    branches: [ "main" ] # Действие на пуш в репозиторий
  pull_request:
    branches: [ "main" ] # Действие на запрос на слияние

jobs:
  build:
    runs-on: ubuntu-latest # Используем последнюю версию Ubuntu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Используем готовый экшен для копирования кода

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Передаем параметр версии Java
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file pom.xml # Обычная команда сборки и тестов